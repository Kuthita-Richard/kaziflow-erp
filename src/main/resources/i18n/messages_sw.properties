# ============================================================
# KaziFlow ERP — Kiswahili (sw) Resource Bundle
# messages_sw.properties
#
# Translator notes:
#   - Business/technical terms kept in English where Swahili equivalent
#     is not commonly used by Kenyan SME owners (e.g. "M-Pesa", "POS",
#     "VAT", "KRA PIN") — code-switching is normal in Kenyan business.
#   - "Deni" is already Swahili (= debt/credit owed).
#   - "Hesabu" = accounts/calculations.
#   - "Ghala" = warehouse/store.
#   - "Mauzo" = sales.
#   - "Manunuzi" = purchases.
#   - "Ripoti" = report.
#   - "Wafanyakazi" = employees.
#   - "Mipangilio" = settings.
# ============================================================

